services:

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-main}
    env_file: environment.d/open-webui.env
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      TERMINAL_SERVER_CONNECTIONS: >-
        [{
          "id": "terminals",
          "name": "Terminals",
          "enabled": true,
          "url": "http://terminals:3000",
          "key": "${TERMINALS_API_KEY}",
          "auth_type": "bearer",
          "server_type": "orchestrator",
          "config": {
            "access_grants": [{
              "principal_type": "user",
              "principal_id": "*",
              "permission": "read"
            }]
          }
        }]
    ports:
      - ${OPEN_WEBUI_PORT:-8080}:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${OPEN_WEBUI_DATA_VOLUME:-open-webui-data}:/app/backend/data
      - /etc/localtime:/etc/localtime:ro
    depends_on: [terminals]
    labels:
      com.centurylinklabs.watchtower.scope: ${COMPOSE_PROJECT_NAME}
    restart: unless-stopped

  terminals:
    image: ghcr.io/open-webui/terminals:${TERMINALS_VERSION:-latest}
    env_file: environment.d/terminals.env
    environment:
      TERMINALS_BACKEND: docker
      TERMINALS_API_KEY: ${TERMINALS_API_KEY}
      TERMINALS_ENABLE_UI: false
      TERMINALS_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_default
      TERMINALS_DOCKER_HOST_DATA_DIR: ${TERMINALS_DATA_VOLUME:?An absolute host path is required}/terminals
    volumes:
      - ${TERMINALS_DATA_VOLUME:?An absolute host path is required}:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    labels:
      com.centurylinklabs.watchtower.scope: ${COMPOSE_PROJECT_NAME}
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower:${WATCHTOWER_VERSION:-latest}
    env_file: environment.d/watchtower.env
    environment:
      WATCHTOWER_SCOPE: ${COMPOSE_PROJECT_NAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    labels:
      com.centurylinklabs.watchtower.scope: ${COMPOSE_PROJECT_NAME}
    restart: unless-stopped

volumes:
   open-webui-data: {}
